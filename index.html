<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: -1 };
  }
  renderVals() {
    // part: 0 red, 1 yellow, 2 blue, 3 green, 4 orange, 5 book
    var real = ['#E54336', '#F5B704', '#4280EF', '#34A354', '#E69100', '#16A366'];
    var ink = ['#FFFFFF', '#1C2326', '#FFFFFF', '#FFFFFF', '#1C2326', '#FFFFFF'];
    var tint = ['#FDEDEB', '#FFF6DB', '#EEF4FE', '#EBF6EE', '#FDF1E0', '#E8F5EE'];
    var goals = [
      { n: '1', part: 2, t: 'إدماج مسؤول وسيادي', d: 'إطار وطني يحمي بيانات المتعلمين.' },
      { n: '2', part: 1, t: 'تمكين المعلم', d: 'تكوين بيداغوجي ورقمي للمدرسين.' },
      { n: '3', part: 3, t: 'تعليم منصف', d: 'تقليص الفوارق بين كل التلاميذ.' },
      { n: '4', part: 0, t: 'حماية ودعم', d: 'للفتيات وللأطفال ذوي الإعاقة.' },
      { n: '5', part: 4, t: 'منظومة شراكة', d: 'فاعلون وطنيون ودوليون، هدف واحد.' },
      { n: '6', part: 5, t: 'نموذج موريتاني رائد', d: 'مرجع إقليمي وقاري.' }
    ];
    var sel = this.state.sel;
    var self = this;
    var mk = function (g) {
      var on = sel === g.part;
      return {
        n: g.n, t: g.t, d: g.d,
        c: real[g.part], cf: ink[g.part],
        bg: on ? tint[g.part] : '#FFFFFF',
        pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ sel: g.part }); }
      };
    };
    var ns = this.state.nsel || 0;
    var newsData = [
      { img: 'assets/children.jpg', pos: '50% 30%', date: 'يناير 2026', title: 'إطلاق المبادرة في قصر المؤتمرات المختار ولد داداه' },
      { img: 'assets/speech.jpg', pos: '50% 25%', date: '[التاريخ]', title: '[عنوان خبر من صفحة المبادرة]' },
      { img: 'assets/students-1.jpg', pos: '50% 35%', date: '[التاريخ]', title: '[عنوان خبر من صفحة المبادرة]' },
      { img: 'assets/students-2.jpg', pos: '50% 30%', date: '[التاريخ]', title: '[عنوان خبر من صفحة المبادرة]' }
    ];
    var news = newsData.map(function (n, i) {
      var on = i === ns;
      return {
        img: n.img, pos: n.pos, date: n.date, title: n.title,
        num: '0' + (i + 1),
        selected: on ? 'true' : 'false',
        op: on ? 1 : 0, sc: on ? 1 : 1.08,
        bar: on ? '#0E6B44' : 'transparent',
        numc: on ? '#0E6B44' : '#A3AFA9',
        titc: on ? '#1C2326' : '#566064',
        abg: on ? '#0E6B44' : 'transparent',
        afg: on ? '#FFFFFF' : '#A3AFA9',
        pick: function () { self.setState({ nsel: i }); }
      };
    });
    var out = {
      news: news,
      cur_news: { title: newsData[ns].title, num: '0' + (ns + 1) },
      goalsR: [mk(goals[0]), mk(goals[2]), mk(goals[4])],
      goalsL: [mk(goals[1]), mk(goals[3]), mk(goals[5])]
    };
    for (var k = 0; k < 6; k++) {
      out['f' + k] = (sel === -1 || sel === k) ? real[k] : '#DCE3DF';
    }
    return out;
  }
}
dcMount(Component);
</script>
